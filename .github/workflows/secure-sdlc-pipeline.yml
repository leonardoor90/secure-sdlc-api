name: Secure SDLC Pipeline

on:
  push:
    branches: [ main, develop, insecure-demo ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  unit-tests:
    name: "1. Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run Maven Tests
        run: mvn test
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  sast-semgrep:
    name: "2. SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep CLI
        run: |
          docker run --rm -v "${PWD}:/src" -w /src returntocorp/semgrep \
            semgrep scan --config=p/security-audit --config=p/java --sarif --output=semgrep.sarif .
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  secrets-gitleaks:
    name: "2. Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks CLI
        run: |
          docker run --rm -v "${PWD}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose
        continue-on-error: false

  sca-dependency-check:
    name: "3. SCA (OWASP Dependency Check)"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Run Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  build-and-scan:
    name: "4. Build & Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secrets-gitleaks, sca-dependency-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t secure-sdlc-api:latest .
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-sdlc-api:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
