name: Secure SDLC Pipeline

on:
  push:
    branches: [ main, develop, insecure-demo ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Unit Tests
        run: mvn test
      
      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  # 2. SAST - Semgrep
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/java
          generateSarif: "1"
      
      - name: Upload SARIF Results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif

  # 3. SCA - Dependency Check
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Secure SDLC API'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired
    
      - name: Upload SCA Report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: reports/

  # 4. Secret Scanning
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config: .gitleaks.toml
          report-format: json
          report-path: gitleaks-report.json
      
      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # 5. Build & Container Scan
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [unit-tests, sast-scan, sca-scan, secret-scan]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
      
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
      
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trivy-reports
          path: '*.sarif'

  # 6. Deploy to Test Environment
  deploy-test:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Test Environment
        run: |
          echo "Deploying to test environment..."
          # Aqui você adicionaria comandos de deploy
          docker-compose -f docker-compose.test.yml up -d
      
      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          exit 1

  # 7. DAST - OWASP ZAP
  dast-scan:
    runs-on: ubuntu-latest
    needs: deploy-test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 2'
      
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report.html

  # 8. Security Gate
  security-gate:
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan, secret-scan, dast-scan]
    if: always()
    
    steps:
      - name: Evaluate Security Gates
        run: |
          # Verifica se há falhas críticas
          if [ "${{ needs.sast-scan.result }}" == "failure" ] || \
             [ "${{ needs.sca-scan.result }}" == "failure" ] || \
             [ "${{ needs.secret-scan.result }}" == "failure" ] || \
             [ "${{ needs.dast-scan.result }}" == "failure" ]; then
            echo "Security gate failed!"
            exit 1
          fi
          echo "All security checks passed!"

  # 9. Production Deployment
  deploy-production:
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # Adicione seus comandos de deploy em produção